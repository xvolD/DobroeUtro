<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доброе утро, балбес!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap');
        
        body { 
            font-family: 'Outfit', sans-serif; 
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Анимированный градиент (GPU ускорение) */
            background: linear-gradient(-45deg, #2e1065, #0f071a, #581c87, #1e1b4b);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            color: #e9d5ff;
            overflow: hidden;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 2rem;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3) rotate(-5deg); }
            100% { transform: scale(1); }
        }
        .animate-pop { animation: pop 0.4s ease-out; }

        .btn-glow { 
            transition: all 0.3s ease; 
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); 
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-glow:hover { box-shadow: 0 0 25px rgba(192, 132, 252, 0.7); transform: scale(1.02); }
    </style>
</head>
<body>

    <div id="main-card" class="glass-card max-w-sm w-full p-8 text-center mx-4">
        <div id="emoji-anim" class="text-7xl mb-6 inline-block animate-pop">😴</div>
        <h1 id="title" class="text-3xl font-bold mb-8 tracking-tight">Хватит спунить!</h1>
        
        <div id="step-container">
            <button id="main-btn" onclick="nextStep()" class="btn-glow bg-purple-600/80 hover:bg-purple-500 text-white px-8 py-4 rounded-full font-bold w-full transition-all">
                Начать утро (0/7)
            </button>
        </div>
    </div>

    <script>
        let step = 0;
        const steps = [
            "Пие?",
            "Хватит уже спунить!",
            "Тут кое-что есть...",
            "Тссс секет...",
            "Мне кстати Юна помогала...",
            "Стриптиииииз!",
            "Кофе будешь? ❤️"
        ];
        const emojis = ['🥱', '👀', '🎁', '✨', '☕', '🔥', '❤️'];

        function updateEmoji(newEmoji) {
            const emojiEl = document.getElementById('emoji-anim');
            emojiEl.classList.remove('animate-pop');
            void emojiEl.offsetWidth; 
            emojiEl.innerText = newEmoji;
            emojiEl.classList.add('animate-pop');
        }

        function nextStep() {
            step++;
            const btn = document.getElementById('main-btn');
            const title = document.getElementById('title');

            if (step <= 7) {
                title.innerText = steps[step - 1];
                updateEmoji(emojis[step - 1]);
                
                if (step === 7) {
                    btn.innerText = "Буду!";
                    btn.onclick = finish;
                } else {
                    btn.innerText = "Дальше (" + step + "/7)";
                }
            }
        }

        function finish() {
            document.getElementById('main-card').innerHTML = `
                <div class="fade-in">
                    <div class="text-7xl mb-4 animate-pop">🥰</div>
                    <h1 class="text-3xl font-bold text-white mb-6">Ща сделаю!</h1>
                    <p class="text-purple-200 text-xl font-bold italic opacity-90">я сися люлю сиси сиси кста❤️</p>
                </div>
            `;
        }
    </script>
</body>
</html>
